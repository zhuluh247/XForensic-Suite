<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XStegoCover | XForensic Suite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#090d16',
                        cardbg: '#111827',
                        accent: '#06b6d4',
                        danger: '#ef4444',
                        success: '#10b981'
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        code, pre { font-family: 'JetBrains Mono', monospace; }
    </style>
</head>
<body class="bg-darkbg text-gray-100 min-h-screen flex flex-col">

    <header class="border-b border-gray-800 bg-cardbg/50 backdrop-blur sticky top-0 z-50 px-8 py-4 flex justify-between items-center">
        <div class="flex items-center space-x-4">
            <a href="index.html" class="px-3 py-1.5 rounded-lg bg-gray-800 hover:bg-gray-700 text-xs font-mono text-gray-300 transition flex items-center space-x-2 border border-gray-700">
                <span>←</span>
                <span>Command Center Hub</span>
            </a>
            <div class="h-4 w-[1px] bg-gray-800"></div>
            <div class="flex items-center space-x-2">
                <span class="text-lg">🔐</span>
                <h1 class="text-lg font-bold text-white">XStegoCover: Cryptographic Steganography Engine</h1>
            </div>
        </div>
        <div class="text-xs font-mono text-gray-400">
            <span class="px-3 py-1 rounded bg-accent/10 text-accent border border-accent/30">ENDPOINTS: /api/stego/hide | /reveal</span>
        </div>
    </header>

    <main class="flex-1 max-w-5xl w-full mx-auto p-8 space-y-6">
        <div class="bg-cardbg border border-gray-800 rounded-2xl p-6 shadow-xl space-y-4">
            <div class="flex space-x-2 bg-gray-900 p-1.5 rounded-xl border border-gray-800">
                <button onclick="setMode('hide')" id="tab-hide" class="flex-1 py-2 text-xs font-bold rounded-lg transition bg-accent text-darkbg">Hide Payload (Embed)</button>
                <button onclick="setMode('reveal')" id="tab-reveal" class="flex-1 py-2 text-xs font-bold rounded-lg transition text-gray-400 hover:text-white">Reveal Payload (Extract)</button>
            </div>

            <div id="mode-form-container" class="space-y-4"></div>

            <button onclick="executeStegoAction()" id="exec-btn" class="w-full py-3 bg-accent hover:bg-cyan-400 text-darkbg font-bold rounded-xl transition shadow-lg shadow-accent/10">
                Execute Cryptographic Embedding
            </button>
        </div>

        <div id="results-panel" class="bg-cardbg border border-gray-800 rounded-2xl p-6 shadow-xl hidden space-y-6">
            <div class="flex justify-between items-center border-b border-gray-800 pb-4">
                <h3 class="text-base font-bold text-white">Steganographic Dossier</h3>
                <span id="badge-verdict" class="px-3 py-1 rounded-full text-xs font-mono font-bold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30">SUCCESS</span>
            </div>

            <div id="metric-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>

            <div class="space-y-3">
                <h4 class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Extraction Briefing</h4>
                <div id="dossier-content" class="space-y-2 text-sm text-gray-300 bg-gray-900/60 p-4 rounded-xl border border-gray-800/80 leading-relaxed"></div>
            </div>

            <div>
                <details class="group bg-gray-900/40 rounded-xl border border-gray-800">
                    <summary class="px-4 py-3 text-xs font-mono text-gray-400 cursor-pointer hover:text-white flex justify-between items-center">
                        <span>Inspect Raw Telemetry Payload</span>
                        <span class="group-open:rotate-180 transition">▼</span>
                    </summary>
                    <div class="p-4 border-t border-gray-800 overflow-x-auto max-h-80">
                        <pre id="raw-json" class="text-xs text-accent"></pre>
                    </div>
                </details>
            </div>
        </div>
    </main>

    <script>
        let currentMode = 'hide';
        let selectedFile = null;

        function setMode(mode) {
            currentMode = mode;
            selectedFile = null;
            document.getElementById('tab-hide').className = mode === 'hide' ? 'flex-1 py-2 text-xs font-bold rounded-lg transition bg-accent text-darkbg' : 'flex-1 py-2 text-xs font-bold rounded-lg transition text-gray-400 hover:text-white';
            document.getElementById('tab-reveal').className = mode === 'reveal' ? 'flex-1 py-2 text-xs font-bold rounded-lg transition bg-accent text-darkbg' : 'flex-1 py-2 text-xs font-bold rounded-lg transition text-gray-400 hover:text-white';
            document.getElementById('exec-btn').innerText = mode === 'hide' ? 'Execute Cryptographic Embedding' : 'Execute Payload Extraction';
            document.getElementById('results-panel').classList.add('hidden');
            renderForm();
        }

        function renderForm() {
            const container = document.getElementById('mode-form-container');
            if (currentMode === 'hide') {
                container.innerHTML = `
                    <div class="border-2 border-dashed border-gray-700 hover:border-accent rounded-xl p-6 text-center cursor-pointer transition bg-gray-900/50">
                        <input type="file" id="file-input" class="hidden" onchange="handleFileSelect(event)">
                        <div onclick="document.getElementById('file-input').click()" class="space-y-2">
                            <div class="text-2xl">🖼️</div>
                            <p class="text-sm font-medium text-gray-300" id="file-label">Select carrier image (.png, .jpg)</p>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Secret Intelligence Message</label>
                        <textarea id="secret-text" placeholder="Type confidential briefing or payload to embed..." class="w-full bg-gray-900 border border-gray-700 focus:border-accent rounded-xl p-3 text-sm text-white outline-none transition h-24 resize-none"></textarea>
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Encryption Password (Optional)</label>
                        <input type="password" id="stego-pwd" placeholder="Optional AES password..." class="w-full bg-gray-900 border border-gray-700 focus:border-accent rounded-xl px-4 py-3 text-sm text-white outline-none transition">
                    </div>
                `;
            } else {
                container.innerHTML = `
                    <div class="border-2 border-dashed border-gray-700 hover:border-accent rounded-xl p-8 text-center cursor-pointer transition bg-gray-900/50">
                        <input type="file" id="file-input" class="hidden" onchange="handleFileSelect(event)">
                        <div onclick="document.getElementById('file-input').click()" class="space-y-2">
                            <div class="text-3xl">🔍</div>
                            <p class="text-sm font-medium text-gray-300" id="file-label">Upload stego carrier image to extract message</p>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Decryption Password (If encrypted)</label>
                        <input type="password" id="reveal-pwd" placeholder="Password if encrypted..." class="w-full bg-gray-900 border border-gray-700 focus:border-accent rounded-xl px-4 py-3 text-sm text-white outline-none transition">
                    </div>
                `;
            }
        }

        function handleFileSelect(event) {
            if (event.target.files.length > 0) {
                selectedFile = event.target.files[0];
                document.getElementById('file-label').innerText = `Selected: ${selectedFile.name} (${Math.round(selectedFile.size / 1024)} KB)`;
            }
        }

        async function executeStegoAction() {
            if (!selectedFile) {
                alert('Please select a carrier file first.');
                return;
            }

            const btn = document.getElementById('exec-btn');
            btn.innerText = 'Processing Cryptographic Buffer...';
            btn.disabled = true;

            const formData = new FormData();
            formData.append('file', selectedFile);

            try {
                if (currentMode === 'hide') {
                    const secretText = document.getElementById('secret-text').value.trim();
                    const pwd = document.getElementById('stego-pwd').value;
                    if (!secretText) throw new Error('Please enter a secret message to embed.');

                    formData.append('secret_text', secretText);
                    if (pwd) formData.append('password', pwd);

                    const res = await fetch('https://xforensic-suite-backend.onrender.com/api/stego/hide', { method: 'POST', body: formData });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.detail || 'Embedding failed');

                    const downloadUrl = `http://localhost:8000${data.download_url}`;
                    const a = document.createElement('a');
                    a.href = downloadUrl;
                    a.download = `stego_${selectedFile.name}`;
                    document.body.appendChild(a);
                    a.click();
                    a.remove();
                    alert('Payload embedded successfully! Carrier image downloaded.');
                } else {
                    const pwd = document.getElementById('reveal-pwd').value;
                    if (pwd) formData.append('password', pwd);

                    const res = await fetch('http://localhost:8000/api/stego/reveal', { method: 'POST', body: formData });
                    const data = await res.json();
                    if (!res.ok) throw new Error(data.detail || 'Extraction failed');

                    document.getElementById('results-panel').classList.remove('hidden');
                    document.getElementById('raw-json').innerText = JSON.stringify(data, null, 2);
                    document.getElementById('metric-grid').innerHTML = `
                        <div class="bg-gray-900/60 p-4 rounded-xl border border-gray-800"><span class="text-xs text-gray-400 block">Status</span><strong class="text-emerald-400 text-sm">${data.verdict}</strong></div>
                        <div class="bg-gray-900/60 p-4 rounded-xl border border-gray-800"><span class="text-xs text-gray-400 block">Extracted Payload</span><strong class="text-cyan-400 text-sm font-mono">${data.secret_text || 'None'}</strong></div>
                    `;
                    document.getElementById('dossier-content').innerHTML = `<p>${data.verdict}</p><p class="font-mono text-cyan-400 mt-2">${data.secret_text || ''}</p>`;
                }
            } catch (err) {
                alert(`Error: ${err.message}`);
            } finally {
                btn.innerText = currentMode === 'hide' ? 'Execute Cryptographic Embedding' : 'Execute Payload Extraction';
                btn.disabled = false;
            }
        }

        renderForm();
    </script>
</body>
</html>
